# ─────────────────────────────────────────────────────────────
# 一键编排：后端 api + 前端 web
# 启动：docker compose up        （加 -d 后台运行）
# 停止：docker compose down
# 重新构建：docker compose up --build
# ─────────────────────────────────────────────────────────────

services:
  # ===== 数据库：PostgreSQL（持久化聊天记录）=====
  db:
    image: postgres:16-alpine
    environment:
      # 这三个变量决定初始化出来的账号/密码/库名，与 api 的 DATABASE_URL 必须对应。
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-ragdb}
    volumes:
      - pgdata:/var/lib/postgresql/data   # 命名卷持久化：容器删了数据还在
    ports:
      - "5432:5432"                 # 暴露到本机，方便本地连库 / 跑迁移脚本 / 用客户端查看
    healthcheck:
      # 用 PG 自带的 pg_isready 探活，通了 api 才启动。
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-ragdb}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ===== 缓存：Redis（重复问题秒回，省 LLM 调用）=====
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]   # AOF 持久化，重启不丢缓存
    volumes:
      - redisdata:/data            # 命名卷持久化
    ports:
      - "6379:6379"                # 暴露到本机，方便用 redis-cli 调试
    healthcheck:
      # 用 redis-cli ping 探活，返回 PONG 才算健康，api 才启动。
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ===== 后端：FastAPI + LangGraph =====
  api:
    build: .                      # 用当前目录的 Dockerfile 构建
    image: agentic-rag-api        # 构建出的镜像名
    env_file:
      - .env                      # 注入 LLM key 等环境变量
    environment:
      # 容器内连库用服务名 db 当主机名（compose 自带 DNS）。
      - DATABASE_URL=postgresql://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD:-rag_pwd}@db:5432/${POSTGRES_DB:-ragdb}
      # 容器内连缓存用服务名 redis 当主机名。
      - REDIS_URL=redis://redis:6379/0
    volumes:
      # 挂载：模型 / 索引 / 数据 / 结果，留在本机，不进镜像
      - ./.cache:/app/.cache
      - ./index:/app/index
      - ./data:/app/data
      - ./results:/app/results
    ports:
      - "8000:8000"               # 映射后端端口（方便直接调试 /api）
    depends_on:
      db:
        condition: service_healthy   # 等 db「健康」后再启动 api
      redis:
        condition: service_healthy   # 等 redis「健康」后再启动 api
    restart: unless-stopped
    # 健康检查：容器内探测 /api/health，通了才算「健康」。
    # 用 python 自带的 urllib（slim 镜像没有 curl）。
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s          # 每 5 秒探一次
      timeout: 3s           # 单次探测超过 3 秒算失败
      retries: 20           # 连续失败 20 次才判定不健康（给模型加载留足时间）
      start_period: 10s     # 启动后前 10 秒的失败不计数（容器刚起，正常还没好）

  # ===== 前端：Nginx 托管静态页 + 转发 /api =====
  web:
    build: ./web                  # 用 web/ 目录的 Dockerfile 构建
    image: agentic-rag-web
    ports:
      - "8080:80"                 # 浏览器访问 http://localhost:8080
    depends_on:
      api:
        condition: service_healthy   # 等 api「健康」（/api/health 通）后再启动 web
    restart: unless-stopped

# 命名卷：PostgreSQL 数据落在这里，docker compose down 不会丢，down -v 才清空。
volumes:
  pgdata:
  redisdata:   # Redis AOF 持久化数据
