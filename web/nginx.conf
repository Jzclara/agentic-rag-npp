# Nginx 站点配置：托管前端静态文件 + 转发 /api 给后端容器

server {
    listen 80;
    server_name _;

    # 允许上传较大的 PDF（Nginx 默认只有 1MB，不放开会 413）
    client_max_body_size 50m;

    # ① 托管前端静态文件
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # SPA 路由兜底：找不到的路径都回 index.html，交给前端路由处理
        try_files $uri $uri/ /index.html;
    }

    # ② 把 /api 开头的请求转发给后端容器
    #    "api" 是 docker-compose.yml 里后端服务的名字；
    #    容器之间靠服务名互相访问，8000 是后端监听端口。
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # SSE 流式响应需要：关掉缓冲，否则前端收不到逐字的流
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
